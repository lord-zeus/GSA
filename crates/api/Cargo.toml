[package]
name = "ser-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ser-db = { path = "../db" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# F#14 — bounded-concurrency proxy geo verification (already in the workspace
# via ser-engine's `browser` feature; enabling here, not a new external crate).
futures-util = "0.3"
# In-process job execution (F#12): run a project's queued jobs via the
# worker pool + HTTP driver. `http` feature pulls the real reqwest HttpDriver
# (used for both the plain-form web engines and the WEB-inbox email engines).
runner = { package = "ser-runner", path = "../runner", default-features = false }
engine = { package = "ser-engine", path = "../engine", default-features = false, features = ["http"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
engine = { package = "ser-engine", path = "../engine" }


[setup]
enabled=1
default checked=0

engine type=Directory
description=Submits your site to a web directory and leaves a link to your website.
dofollow=1
anchor text=1
creates own page=1
uses pages=0

page must have1=/index.php?a=join
page must have2=aardvarktopsitesphp.com|>Aardvark Topsites PHP<|/index.php?a=out&u=' + username;|/index.php?a=out&amp;u=' + username;

;options to search for thies sites....
search term="Powered by Aardvark Topsites PHP"|"Rate and Review This Site" "Show All Reviews" "Average Rating" "Number of Ratings"|Rankings Join "User Control Panel" "Overall Stats"|"Enter the text as it is shown in the image below (Can't read?)" "Banner URL"|"Please enter your rating and review for" "in the form below." "Review - No HTML allowed" |"Czas wykonania skrytpu"|"Script Execution Time" "SQL Queries" "Members"

add keyword to search=2
;0=no, 1=yes, 2=only blog search
use blog search=0

;if enabled we will extract keywords from meta-keywords and later try to find new targets
extract keywords=0

;overwrite options from project
skip ext links on=0
skip content on=0
skip url content on=0
posted domain check=1

;-------------------------------------------------------------------------
;the variables we have to define for this engine (if not already defined before)
;name, keyword, url, e-mail are already defined by default

;the form variables and how to fill them

[URL]
type=url 


[Website_title]
type=text
allow html=0
must be filled=1
hint=Thats usually a anchor text, so please make sure it holds an important keyword.
replace=,; - 

[Category]
type=category
must be filled=1
hint=See some sample sites what categories exist. It is a bit complex to define the right one though.

[Description_250]
type=memo
max length=250
allow html=0
must be filled=1
hint=Use spin syntax here to not get duplicate content.
custom mode=1

[Login]
type=login
must be filled=1
hint=The login for websites that need an account. Use numbers and letters only.
min length=10
static=1
upcase=0

[Password]
type=password
must be filled=1
hint=A password used for websites that need an account. Use numbers and letters only.
min length=15
static=1

